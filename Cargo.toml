[package]
name = "luvienne"
version = "0.4.1"
edition = "2024"
description = "A keyboard-driven SSH connection manager for the terminal"
repository = "https://github.com/clintcan/luvienne"
license = "Apache-2.0"
# Key fixtures for the PuTTY and OpenSSH parsers. Generated, not real secrets,
# but a published crate is permanent and there is no reason to put key material
# on crates.io. Excluding them means `cargo test` does not pass from an unpacked
# .crate; clone the repository to run the suite.
exclude = ["tests/fixtures/*"]

[dependencies]
color-eyre = "0.6.5"
directories = "6.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
russh = "0.62.4"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "io-std",
    "signal",
    "sync",
    "time",
] }
toml = "1.1.3"
toml_edit = "0.25.13"
unicode-width = "0.2"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[profile.release]
# A CLI people install and run for months: worth trading build time for a
# smaller, faster binary.
lto = true
codegen-units = 1
# Debug info only: symbol names are kept so a user-reported backtrace still
# names functions.
strip = "debuginfo"
# Deliberately NOT panic = "abort". A panic in a session task would then take
# the whole app down with it, killing every other live session, instead of
# losing the one task. The size saving is not worth that.
