name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here writes to the repository, so no job asks for more than read.
permissions: {}

# A newer push to the same branch makes the running one irrelevant. This is the
# opposite of the release workflow, where a run must never be cancelled midway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # GitHub's own `shell: bash` is this minus `-u`. Spelling it out here means
    # no step has to open with `set -euo pipefail`, and none can forget to.
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Formatting is platform-independent, so it runs once rather than per target.
  # Split out from `test` so a stray tab fails in seconds instead of after a
  # full dependency build.
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable

      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Both operating systems and both architectures, without paying for
        # four runners: Linux is covered on x86_64, macOS on arm64. Clippy runs
        # on both deliberately — src/keystore/mod.rs carries cfg'd variants
        # whose `allow`s only matter on the platform that cannot construct them.
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          rustc --version --verbose

      # aws-lc-sys, pulled in through russh -> rustls, compiles C and needs cmake.
      - name: Ensure cmake is present
        if: runner.os == 'Linux'
        run: |
          command -v cmake >/dev/null && exit 0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake

      # Downloaded crates only — deliberately not `target`, which is 2.7GB for
      # this dependency graph. Two matrix legs of that, re-saved whenever
      # Cargo.lock changes (weekly, via Dependabot), would churn through the
      # 10GB repository cache limit and start evicting itself. A cold build here
      # is around 100 seconds, which is not worth that.
      #
      # Keyed on the lockfile alone: these are source tarballs and a registry
      # index, so which compiler is installed has no bearing on them.
      - name: Cache downloaded crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ matrix.runner }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.runner }}-cargo-

      # --locked throughout: CI must fail when Cargo.lock disagrees with
      # Cargo.toml, which is exactly what a forgotten version bump looks like.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # `cargo test` builds the unit-test harness, not the plain binary, so this
      # builds it once and then runs it directly rather than going back through
      # cargo for each invocation.
      - name: Check the CLI runs without a terminal
        run: |
          cargo build --locked
          ./target/debug/luvienne --version
          # A bare run has no tty here and must explain itself rather than
          # panic. The phrase comes from the wrap_err in src/main.rs — if you
          # reword it there, reword it here and in the Homebrew formula's test.
          if output=$(./target/debug/luvienne 2>&1); then
            echo "::error::expected a non-zero exit without a terminal"
            exit 1
          fi
          grep -q "needs a terminal" <<<"$output"
