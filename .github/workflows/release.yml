name: release

# Builds macOS and Linux binaries for a published release and attaches them,
# with a SHA256SUMS file, to that release.
#
# `workflow_dispatch` exists so a failed release build can be re-run against an
# existing tag without deleting and recreating the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach binaries to, e.g. v0.1.0
        required: true
        type: string

# No token permissions by default. Each job opts in to exactly what it needs,
# so a compromised dependency in the build cannot write to the repository.
permissions: {}

# Two runs for the same tag would race to upload the same asset names. This is
# the one place the tag expression has to be written out: `concurrency` is
# evaluated before any job exists, so it cannot read a job's `env`.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    # GitHub's own `shell: bash` is this minus `-u`. Spelling it out here means
    # no step has to open with `set -euo pipefail`, and none can forget to.
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  CARGO_TERM_COLOR: always
  # Nothing is reused between these one-shot runners, so incremental state is
  # only overhead.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    # Resolved once for the job. Every step below just reads $TAG and $TARGET.
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TARGET: ${{ matrix.target }}
    strategy:
      # Report every broken target in one run rather than stopping at the first.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          # Cross-compiled from the arm64 runner: the macOS SDK carries both
          # slices, and this avoids depending on an Intel runner image.
          - target: x86_64-apple-darwin
            runner: macos-15
    steps:
      # Checkout is pinned to the released tag, not to a branch, so a push to
      # main between tagging and this run cannot change what ships.
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The build needs no git credentials; leaving the token in
          # .git/config would expose it to anything that runs afterwards.
          persist-credentials: false

      # First, and deliberately: a tag that disagrees with Cargo.toml would ship
      # a binary whose --version contradicts the release it is attached to, and
      # every runner image already has a cargo that can answer this. Behind the
      # toolchain install it would burn four runners' setup to learn it.
      - name: Verify the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match Cargo.toml version ${version}"
            exit 1
          fi

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          rustc --version --verbose

      # aws-lc-sys, pulled in through russh -> rustls, compiles C and needs
      # cmake. The x86_64 image ships it; the arm64 image is slimmer.
      - name: Ensure cmake is present
        if: runner.os == 'Linux'
        run: |
          command -v cmake >/dev/null && exit 0
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y cmake

      # --locked: build the dependency versions the tag was tested with, not
      # whatever has been published since.
      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Smoke-test the binary
        # A cross-compiled x86_64 binary will not run on the arm64 runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: '"target/${TARGET}/release/luvienne" --version'

      - name: Package
        run: |
          staging="luvienne-${TAG}-${TARGET}"
          mkdir -p "dist/${staging}"
          cp "target/${TARGET}/release/luvienne" "dist/${staging}/"
          cp LICENSE README.md hosts.example.toml "dist/${staging}/"
          tar -C dist -czf "dist/${staging}.tar.gz" "${staging}"

      - name: Upload the archive for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: luvienne-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          # The payload is already gzipped; zipping it again costs CPU on both
          # ends and saves nothing.
          compression-level: 0

  publish:
    name: attach binaries to the release
    # Skipped if any target failed, so a release never gets a partial set.
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Upload release assets.
      contents: write
      # The two below are what attest-build-provenance needs to sign and record
      # a provenance statement for each archive: a verifiable claim about which
      # workflow, commit and runner produced these bytes.
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # There is no checkout in this job, so `gh` cannot infer the repository.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect every target's archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: luvienne-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          # `shasum -a 256` rather than sha256sum: same output format, and it is
          # present on both the Linux and macOS images if this ever moves.
          shasum -a 256 -- *.tar.gz | tee SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Attest what was built
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attach the archives to the release
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

      # Runs only after the upload succeeds, so the notes never describe
      # binaries that are not there.
      - name: Document how to verify and unquarantine the binaries
        run: |
          marker='<!-- binaries-note -->'
          body=$(gh release view "$TAG" --json body --jq .body)
          # A re-run must not stack a second copy of the note.
          if grep -qF "$marker" <<<"$body"; then
            echo "note already present, leaving the body alone"
            exit 0
          fi
          # Quoted heredoc: none of this is expanded by the shell. Piped
          # straight out, so nothing has to restore the newline a $(...) would
          # have stripped.
          {
            printf '%s\n\n' "$body"
            cat <<'EOF'
          <!-- binaries-note -->
          ## Binaries

          Check a download against `SHA256SUMS`:

          ```sh
          shasum -a 256 -c SHA256SUMS --ignore-missing
          ```

          The macOS binaries are ad-hoc signed but not notarized. Fetching with
          `curl` and unpacking with `tar` works as-is. A browser download is
          quarantined by macOS and Gatekeeper will refuse to run it, which clears with:

          ```sh
          xattr -d com.apple.quarantine ./luvienne
          ```
          EOF
          } | gh release edit "$TAG" --notes-file -
