version: 2

updates:
  # The workflows pin every action to a commit SHA, which is the right default
  # but goes stale silently — a pinned action is frozen at whatever it was the
  # day it was pinned, security fixes included. Dependabot rewrites both the SHA
  # and the trailing version comment, so the pins stay current without ever
  # loosening back to a mutable tag.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    groups:
      # One PR for the lot. These move together and are reviewed together.
      actions:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as a single PR; majors stay separate,
      # since those are the ones that need reading rather than merging.
      cargo-minor-and-patch:
        update-types:
          - minor
          - patch
